name: Feature request / اقتراح ميزة
description: Something Midad should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do? / ماذا تريد أن تفعل؟
      description: Describe the calligraphic or design task, not the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today? / كيف تفعله حاليًا؟
