# Builds the desktop app for Windows, macOS and Linux.
# * Push a tag v*  → installers attached to a draft GitHub release.
# * Run it by hand (Actions → Desktop release → Run workflow) → installers
#   uploaded as workflow artifacts only, no release created.
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,wasm32-unknown-unknown
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ""
            rust_targets: wasm32-unknown-unknown
          - platform: windows-latest
            args: ""
            rust_targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:wasm
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Empty tag name (manual run) = build only, no release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Midad ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Keep installers of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: midad-desktop-${{ matrix.platform }}-${{ strategy.job-index }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error
