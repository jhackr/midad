[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midad-style"
version = "0.1.0"
description = "Compile and inspect Midad calligraphy style packages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["fonttools>=4.50"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
midad-style = "midad_style.__main__:main"

[tool.setuptools]
packages = ["midad_style"]
