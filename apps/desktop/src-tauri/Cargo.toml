[package]
name = "midad-desktop"
description = "Midad desktop app (Tauri shell around the web editor)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: building the desktop shell needs WebView system
# libraries (WebKitGTK on Linux), which the root workspace must not require.
[workspace]

[lib]
name = "midad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
